[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hs300-rotation"
version = "0.1.0"
description = "Weekly CSI 300 stock rotation research and paper-trading toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
data = ["akshare>=1.16"]
laya = ["laya>=0.3.6,<0.4"]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
hs300-rotation = "hs300_rotation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
